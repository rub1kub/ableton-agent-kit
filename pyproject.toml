[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-agent-kit"
version = "0.1.0"
description = "Evidence-driven Ableton workflows for music agents: LiveMCP, ALS audits, audio analysis and a Codex skill"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "rub1kub"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.12,<1", "pyloudnorm>=0.1.1,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "PyYAML>=6,<7"]
mp3 = ["imageio-ffmpeg>=0.5,<1", "mutagen>=1.47,<2"]
pitch = ["librosa>=0.10.2,<1"]
asr = ["faster-whisper>=1.1,<2"]
plot = ["matplotlib>=3.8,<4"]
windows = ["comtypes>=1.4,<2; sys_platform == 'win32'"]
mcp = ["mcp>=1.12,<2"]
benchmark = ["tiktoken>=0.9,<1"]
plugins = ["pedalboard>=0.9.26,<1"]

[project.scripts]
ableton-agent = "ableton_agent.cli:main"
ableton-agent-mcp = "ableton_agent.mcp_server:main"

[project.urls]
Repository = "https://github.com/rub1kub/ableton-agent-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
